services:
  freetetra:
    build: .
    image: freetetra:latest
    container_name: freetetra
    env_file:
      - ${ENV_COMMON_FILE:-.env}
      - ${ENV_FREETETRA_FILE:-.env}
    ports:
      - "8101:8101"
      - "8102:8102"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  webradio:
    build: .  
    image: freetetra:latest
    container_name: freetetra-webradio
    entrypoint: ["/app/tetra-brew-webradio"]
    env_file:
      - ${ENV_COMMON_FILE:-.env}
      - ${ENV_WEBRADIO_FILE:-.env}
    environment:
      BREW_MODE: webradio
      BREW_CLIENT_BASE_URL: http://freetetra:8101
      BREW_CLIENT_USERNAME: "2635717"
      BREW_CLIENT_PASSWORD: "blafablafa"
      WEBRADIO_ENABLED: "true"
      WEBRADIO_STREAM_URL: "https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3"
      WEBRADIO_TALKGROUP: "10"
      WEBRADIO_SOURCE_ISSI: "123"
      WEBRADIO_ENCODER_BIN: /app/tetra-acelp-stdio
      WEBRADIO_RECONNECT_DELAY: "5s"
    depends_on:
      - freetetra
    restart: unless-stopped

  # Second webradio instance, transmitting the same stream on TG 15002.
  webradio2:
    build: .
    image: freetetra:latest
    container_name: freetetra-webradio2
    entrypoint: ["/app/tetra-brew-webradio"]
    env_file:
      - ${ENV_COMMON_FILE:-.env}
      - ${ENV_WEBRADIO2_FILE:-.env}
    environment:
      BREW_MODE: webradio
      BREW_CLIENT_BASE_URL: http://freetetra:8101
      BREW_CLIENT_USERNAME: "2635723"
      BREW_CLIENT_PASSWORD: "blafablafa"
      WEBRADIO_ENABLED: "true"
      WEBRADIO_STREAM_URL: "https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3"
      WEBRADIO_TALKGROUP: "15002"
      WEBRADIO_SOURCE_ISSI: "124"
      WEBRADIO_ENCODER_BIN: /app/tetra-acelp-stdio
      WEBRADIO_RECONNECT_DELAY: "5s"
    depends_on:
      - freetetra
    restart: unless-stopped

  echo:
    build: .
    image: freetetra:latest
    container_name: freetetra-echo
    entrypoint: ["/app/tetra-brew-echo"]
    env_file:
      - ${ENV_COMMON_FILE:-.env}
      - ${ENV_ECHO_FILE:-.env}
    environment:
      BREW_MODE: echo
      BREW_CLIENT_BASE_URL: http://freetetra:8101
      BREW_CLIENT_USERNAME: "2635720"
      BREW_CLIENT_PASSWORD: "blafablafa"
      ECHO_TALKGROUP: "10002"
      ECHO_SOURCE_ISSI: "899002"
      ECHO_PLAYBACK_DELAY: "300ms"
    depends_on:
      - freetetra
    restart: unless-stopped

  # Bidirectional TG linker: mirrors traffic between paired talkgroups
  # so users on either side hear each other.
  link:
    build: .
    image: freetetra:latest
    container_name: freetetra-link
    entrypoint: ["/app/tetra-brew-link"]
    env_file:
      - ${ENV_COMMON_FILE:-.env}
      - ${ENV_LINK_FILE:-.env}
    environment:
      BREW_MODE: link
      BREW_CLIENT_BASE_URL: http://freetetra:8101
      BREW_CLIENT_USERNAME: "2635724"
      BREW_CLIENT_PASSWORD: "blafablafa"
      LINK_BREW_ISSI: "899004"
      LINK_SOURCE_ISSI: "899004"
      LINK_PAIRS: "10:10000,11:10001,12:10002"
      LINK_MIRROR_HANGOFF: "200ms"
    depends_on:
      - freetetra
    restart: unless-stopped

  # Opt-in app. Bring it up explicitly with:
  #   docker compose --profile soundboard up -d soundboard
  # Default `docker compose up` skips it so the base stack stays minimal.
  soundboard:
    build: .
    image: freetetra:latest
    container_name: freetetra-soundboard
    profiles: ["soundboard"]
    entrypoint: ["/app/tetra-brew-soundboard"]
    env_file:
      - ${ENV_COMMON_FILE:-.env}
      - ${ENV_SOUNDBOARD_FILE:-.env}
    environment:
      BREW_MODE: soundboard
      # Point at free2.tetra.cat — the local freetetra has no MS subscribers
      # on TG 15001 (recipients=0 in its logs) and FEDERATION_PEERS is empty,
      # so TX from here lands nowhere. free2 should have real listeners and,
      # via its own FEDERATION_PEERS, fan the call out to free.tetra.cat too.
      BREW_CLIENT_BASE_URL: https://free.tetra.cat
      BREW_CLIENT_USERNAME: "2635721"
      BREW_CLIENT_PASSWORD: "blafablafa"
      SOUNDBOARD_ENABLED: "true"
      SOUNDBOARD_LISTEN_ADDR: ":8203"
      SOUNDBOARD_SOUNDS_DIR: /app/sounds
      SOUNDBOARD_BREW_ISSI: "899003"
      SOUNDBOARD_SOURCE_ISSI: "899003"
      SOUNDBOARD_ENCODER_BIN: /app/tetra-acelp-stdio
    volumes:
      - ./sounds:/app/sounds
    ports:
      - "8203:8203"
    depends_on:
      - freetetra
    restart: unless-stopped

  # Browser push-to-talk: talk/listen on a talkgroup from the browser.
  # Half-duplex — hold-to-talk keys the channel, releasing returns to listening.
  # Opt-in app. Bring it up explicitly with:
  #   docker compose --profile ptt up -d simplexptt
  # then open http://<host>:8205/ , grant mic access, and hold to talk.
  simplexptt:
    build: .
    image: freetetra:latest
    container_name: freetetra-simplexptt
    profiles: ["ptt"]
    entrypoint: ["/app/tetra-brew-simplexptt"]
    env_file:
      - ${ENV_COMMON_FILE:-.env}
      - ${ENV_SIMPLEXPTT_FILE:-.env}
    environment:
      BREW_MODE: simplexptt
      BREW_CLIENT_BASE_URL: http://freetetra:8101
      BREW_CLIENT_USERNAME: "2635722"
      BREW_CLIENT_PASSWORD: "blafablafa"
      SIMPLEXPTT_ENABLED: "true"
      SIMPLEXPTT_LISTEN_ADDR: ":8205"
      SIMPLEXPTT_TALKGROUPS: "10"
      SIMPLEXPTT_BREW_ISSI: "899006"
      SIMPLEXPTT_ENCODER_BIN: /app/tetra-acelp-stdio
      SIMPLEXPTT_DECODER_BIN: /app/tetra-acelp-stdio-decoder
    ports:
      - "8205:8205"
    depends_on:
      - freetetra
    restart: unless-stopped

  # SIP <-> TETRA gateway: bridges individual (private) calls between a SIP/RTP
  # peer (PBX/softphone) and the TETRA network. TETRA users call SIP_GATEWAY_ISSI
  # to reach SIP; inbound SIP INVITEs are routed to a TETRA ISSI by the dialed
  # number. Audio is transcoded between RTP (ACELP payload) and TETRA traffic.
  #
  # Opt-in — it needs a real SIP registrar + credentials, so it does NOT start on
  # a plain `docker compose up`. Fill in the SIP_* placeholders below, then:
  #   docker compose --profile sip up -d sip
  # RTP needs a routable address: set SIP_RTP_ADVERTISE_IP to the host's public
  # IP (behind NAT), or run this service with network_mode: host.
  sip:
    build: .
    image: freetetra:latest
    container_name: freetetra-sip
    profiles: ["sip"]
    entrypoint: ["/app/tetra-brew-sip"]
    env_file:
      - ${ENV_COMMON_FILE:-.env}
      - ${ENV_SIP_FILE:-.env}
    environment:
      BREW_MODE: sip
      BREW_CLIENT_BASE_URL: http://freetetra:8101
      BREW_CLIENT_USERNAME: "2635724"
      BREW_CLIENT_PASSWORD: "blafablafa"
      SIP_ENABLED: "true"
      # TETRA identity of the gateway (individual subscriber). Callable from radios.
      SIP_GATEWAY_ISSI: "899007"
      # --- SIP registrar / proxy (REQUIRED — placeholders) ---
      SIP_SERVER_ADDR: "sip.example.com:5060"   # host:port of your SIP server
      SIP_DOMAIN: "example.com"                  # SIP domain / realm
      SIP_USERNAME: "changeme"                   # SIP auth user
      SIP_PASSWORD: "changeme"                   # SIP auth password
      SIP_LOCAL_USER: "brew"                     # local AOR user part
      SIP_TRANSPORT: "udp"
      SIP_REGISTER_ENABLED: "true"
      SIP_REGISTER_EXPIRES: "3600"
      # --- media (RTP) ---
      SIP_BIND_ADDR: "0.0.0.0:5060"
      SIP_RTP_BIND_ADDR: "0.0.0.0"
      SIP_RTP_PORT_START: "10000"
      SIP_RTP_ADVERTISE_IP: ""                   # set to the host's routable IP
      SIP_ACELP_PAYLOAD_TYPE: "96"
      # ISSI assigned to inbound SIP callers when the dialed number can't be mapped
      SIP_INBOUND_DEFAULT_ISSI: "0"
    ports:
      - "5060:5060/udp"
      - "10000-10020:10000-10020/udp"
    depends_on:
      - freetetra
    restart: unless-stopped
